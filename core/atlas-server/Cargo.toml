[package]
name = "atlas-server"
description = "axum JSON API + static web, and the `atlas` command-line binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-core.workspace = true
atlas-search.workspace = true
atlas-paths.workspace = true
atlas-layout.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum.workspace = true
tokio.workspace = true
rusqlite.workspace = true
blake3.workspace = true
rayon.workspace = true
# HTTP plumbing on top of axum: static files (traversal-safe), gzip/brotli,
# timeouts, body limit, optional CORS.  Same tower stack axum is built on.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "cors", "timeout", "limit", "set-header"] }
serde_urlencoded = "0.7"

[dev-dependencies]
http-body-util = "0.1"
