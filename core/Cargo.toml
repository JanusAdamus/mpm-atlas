[workspace]
resolver = "3"
members = ["atlas-core", "atlas-search", "atlas-paths", "atlas-layout", "atlas-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# One place for versions so parallel workers do not drift.  Add a crate here, then
# `name.workspace = true` in the member.  Unused entries are not compiled.
[workspace.dependencies]
atlas-core = { path = "atlas-core" }
atlas-search = { path = "atlas-search" }
atlas-paths = { path = "atlas-paths" }
atlas-layout = { path = "atlas-layout" }
rusqlite = { version = "0.40", features = ["bundled"] }
memmap2 = "0.9"
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
blake3 = { version = "1.8", features = ["rayon"] }
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
axum = "0.8"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal"] }
tantivy = "0.26"
roaring = "0.11"
criterion = "0.8"
memory-stats = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# Tests run fast enough unoptimized; benches inherit release.
[profile.bench]
inherits = "release"
